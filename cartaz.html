<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cartaz · Fila do GTA VI</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><script src="js/vendor/qrcode.js"></script>
<style>@font-face{font-family:PD;src:url(assets/pricedown.otf)}@page{size:A4;margin:0}*{box-sizing:border-box}
html,body{margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:210mm;height:297mm;margin:auto;background:#12041F url(assets/bg_port.jpg) center/cover;color:#fff;font-family:system-ui,Arial,sans-serif;text-align:center;padding:12mm 14mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.parc{display:flex;gap:10mm;align-items:center;justify-content:center}.parc img{height:17mm;object-fit:contain}.parc .g6{height:21mm}
h1{font-family:PD,Impact,sans-serif;font-size:21mm;line-height:.95;margin:0;color:#ffd23f;text-shadow:1.2mm 1.2mm 0 #ff4fc3;letter-spacing:.3mm}
.sub{font-size:7mm;font-weight:700;margin:0}
.qr{background:#fff;padding:5mm;border:2mm solid #ff4fc3;box-shadow:3mm 3mm 0 rgba(0,0,0,.6);width:112mm}.qr #qr{line-height:0}.qr svg{display:block;width:100%;height:auto}
.url{font-family:PD,Impact,sans-serif;font-size:9mm;color:#ff8fd6}
.st{display:flex;gap:4mm;width:100%}.st div{flex:1;background:rgba(0,0,0,.55);border:.5mm solid #ff4fc3;border-radius:3mm;padding:3.5mm 2mm;font-size:4.4mm;line-height:1.25}.st b{display:block;font-family:PD,Impact,sans-serif;color:#ffd23f;font-size:10mm;line-height:1}
.ev{font-size:5mm;font-weight:700;opacity:.9}</style></head><body>
<div class="pg"><div class="parc"><img src="assets/liga.png" alt=""><img class="g6" src="assets/gta6.png" alt=""><img src="assets/superxp.png" alt=""></div>
<div><h1>ENTRE NA FILA<br>DO GTA VI</h1><p class="sub" style="margin-top:4mm">Aponte a câmera do celular para o QR code</p></div>
<div class="qr"><div id="qr"></div></div><div class="url" id="u"></div>
<div class="st"><div><b>1</b>Escaneie e digite seu nome</div><div><b>2</b>Você joga 20 min. O staff pode dar +10 min</div><div><b>3</b>Mantenha a tela acesa: avisamos a sua vez</div></div>
<div class="ev">Noite de Jogos Vice City · 19/11 · Ágora Uni</div></div>
<script>const u=new URLSearchParams(location.search).get('u')||'https://filagta.vercel.app';document.getElementById('u').textContent=u.replace('https://','');
const q=qrcode(0,'M');q.addData(u);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+4} ${r+4}h1v1h-1z`;
document.getElementById('qr').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#12041F"/></svg>`;</script></body></html>
