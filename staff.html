<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Staff · Fila do GTA VI</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="lib.js"></script>
<style>.wrap{max-width:640px}.who{font-size:44px;text-align:center;margin:4px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.jump{font-size:15px;color:var(--gold)}
.bar{display:flex;justify-content:space-between;align-items:center}</style>
</head><body><div class="wrap"><div id="app"></div></div>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = null, PIN = '', authed = false, last = '', fired = {};
try { S = +localStorage.getItem('fila_staff_st') || null; PIN = localStorage.getItem('fila_staff_pin') || ''; } catch (e) {}
const qs = new URLSearchParams(location.search); if (qs.get('st')) { S = +qs.get('st'); PIN = qs.get('pin') || PIN; }
const act = async (name, args, ok) => { try { await FILA.rpc(name, { ...args, p_pin: PIN }); if (ok) toast(ok); } catch (e) { toast(e.message, true); } };
function toast(m, bad) { const d = document.createElement('div'); d.className = 'toast'; if (bad) d.style.borderColor = 'var(--bad)'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }

function loginView(err) {
  last = '';
  app.innerHTML = `<p class="ttl">PAINEL DO STAFF</p><div class="box"><h3>QUAL ESTAÇÃO?</h3>
  <div class="row">${[1, 2, 3, 4].map(n => `<button class="btn grow ${n === S ? 'y' : 'd'}" data-st="${n}">#${n}</button>`).join('')}</div>
  <h3 class="mt">PIN</h3><input id="pin" type="tel" inputmode="numeric" maxlength="8" placeholder="PIN" value="${esc(PIN)}">
  <button id="in" class="btn y block mt">ENTRAR</button><div class="err" id="err">${err || ''}</div></div>`;
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { S = +b.dataset.st; PIN = $('#pin').value; loginView(); });
  $('#in').onclick = login;
  $('#pin').onkeydown = e => { if (e.key === 'Enter') login(); };
}
async function login() {
  PIN = ($('#pin') ? $('#pin').value : PIN).trim();
  if (!S || !PIN) return loginView('Escolha a estação e digite o PIN');
  try {
    const ok = FILA.MOCK ? true : await FILA.rpc('fila_auth', { p_station: S, p_pin: PIN });
    if (!ok) return loginView('PIN incorreto');
  } catch (e) { return loginView('Sem conexão. Tente de novo.'); }
  try { localStorage.setItem('fila_staff_st', S); localStorage.setItem('fila_staff_pin', PIN); } catch (e) {}
  authed = true; ALERT.unlock(); last = ''; render();
}
function logout() { authed = false; PIN = ''; try { localStorage.removeItem('fila_staff_pin'); } catch (e) {} loginView(); }

function render() {
  if (!authed) return;
  const st = FILA.station(S), now = FILA.now(), { P, W, slots } = st;
  let cur = '';
  if (P) {
    const started = FILA.ms(P.starts_at) <= now, rem = FILA.ms(P.ends_at) - now;
    cur = `<div class="box"><div class="bar"><h3>JOGANDO AGORA</h3>${P.extra_min ? `<span class="tag" style="background:var(--gold)">+${P.extra_min} MIN</span>` : ''}</div>
      <div class="who ${P.fast ? 'gold' : ''}">${esc(P.name)}</div>
      ${started ? `<div class="timer" data-t="rem:${FILA.ms(P.ends_at)}">--:--</div><p class="sub">${rem <= 0 ? 'TEMPO ESGOTADO' : 'tempo restante'}</p>`
                : `<p class="sub">começa em</p><div class="timer warn" data-t="until:${FILA.ms(P.starts_at)}">--:--</div>`}
      <div class="row mt"><button class="btn g grow" data-a="ext">+${FILA.cfg.extend_min} MIN</button></div>
      <div class="row mt"><button class="btn d grow s" data-a="fin">ENCERRAR AGORA</button><button class="btn d grow s" data-a="abs" data-id="${P.id}">AUSENTE → FIM</button></div></div>`;
  } else cur = `<div class="box c"><h3>ESTAÇÃO LIVRE</h3><p class="sub">Ninguém jogando. O próximo da fila começa automaticamente.</p></div>`;

  const rows = slots.map(({ t, start }, i) => `<div class="qrow"><div class="qpos">${i + 1}</div>
    <div class="qname ${t.fast ? 'gold' : ''}">${esc(t.name)}${t.fast && t.jumped_from ? `<div class="jump">⚡ passou do ${t.jumped_from}º para a frente</div>` : ''}</div>
    <div class="qeta">${FILA.clock(start)}<br>em <span data-t="eta:${Math.round(start / 1000)}">--</span> min</div>
    <div class="acts">${t.fast ? `<button class="btn s d" data-a="unfast" data-id="${t.id}">DESFAZER ⚡</button>` : `<button class="btn s g" data-a="fast" data-id="${t.id}">⚡ FAST</button>`}
      <button class="btn s d" data-a="abs" data-id="${t.id}">→ FIM</button><button class="btn s r" data-a="rm" data-id="${t.id}">✕</button></div></div>`).join('');

  const html = `<div class="bar"><p class="ttl" style="text-align:left;font-size:42px">ESTAÇÃO #${S}</p><button class="btn s d" data-a="out">SAIR</button></div>
    ${cur}
    <div class="box"><h3>FILA #${S} · ${W.length} AGUARDANDO</h3>${rows || '<p class="sub">Fila vazia.</p>'}</div>
    <div class="box"><h3>ADICIONAR PESSOA</h3><input id="addn" type="text" maxlength="30" placeholder="NOME">
      <div class="row mt"><label class="row grow" style="font-size:20px"><input id="addf" type="checkbox" style="width:26px;height:26px"> FAST-PASS</label><button class="btn y" data-a="add">ADICIONAR</button></div></div>`;
  // não redesenha enquanto o staff digita; aplica quando sair do campo
  const typing = document.activeElement && document.activeElement.id === 'addn';
  if (html !== last && !typing) { const v = ($('#addn') || {}).value, c = ($('#addf') || {}).checked; app.innerHTML = html; if (v) $('#addn').value = v; if (c) $('#addf').checked = c; last = html; }
  tickTimers();
  // alertas de tempo para o staff
  if (P && FILA.ms(P.starts_at) <= now) {
    const rem = FILA.ms(P.ends_at) - now, k = P.id + P.ends_at;
    if (rem <= 0) { if (!fired[k + 'z']) { fired[k + 'z'] = 1; ALERT.beep(4); } }
    else if (rem <= 60000) { if (!fired[k + '60']) { fired[k + '60'] = 1; ALERT.beep(3); } }
    else if (rem <= 300000 && !fired[k + '300']) { fired[k + '300'] = 1; ALERT.beep(2); }
  }
}
function tickTimers() {
  const now = FILA.now();
  document.querySelectorAll('[data-t]').forEach(el => {
    const i = el.dataset.t.indexOf(':'), k = el.dataset.t.slice(0, i), v = +el.dataset.t.slice(i + 1);
    if (k === 'rem') { const r = v - now; el.textContent = FILA.mmss(r); el.classList.toggle('crit', r <= 60000); el.classList.toggle('warn', r > 60000 && r <= 300000); }
    else if (k === 'until') el.textContent = FILA.mmss(v - now);
    else if (k === 'eta') el.textContent = FILA.mins(v * 1000 - now);
  });
}
app.addEventListener('focusout', e => { if (e.target.id === 'addn') setTimeout(render, 100); });
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, id = b.dataset.id;
  if (a === 'out') return logout();
  if (a === 'ext') return act('fila_extend', { p_station: S }, '+' + FILA.cfg.extend_min + ' min aplicado');
  if (a === 'fin') { if (confirm('Encerrar o jogo agora? O próximo começa em 30s.')) act('fila_finish', { p_station: S }); return; }
  if (a === 'abs') { if (confirm('Mandar para o FIM da fila (ausente)?')) act('fila_absent', { p_ticket: id }, 'Enviado para o fim da fila'); return; }
  if (a === 'rm') { if (confirm('Remover esta pessoa da fila?')) act('fila_remove', { p_ticket: id }); return; }
  if (a === 'fast') return act('fila_fast', { p_ticket: id }, '⚡ Fast-pass marcado');
  if (a === 'unfast') return act('fila_unfast', { p_ticket: id }, 'Fast-pass desfeito');
  if (a === 'add') { const n = $('#addn').value.trim(); if (!n) return; await act('fila_add', { p_name: n, p_station: S, p_fast: $('#addf').checked }, 'Adicionado'); $('#addn').value = ''; $('#addf').checked = false; last = ''; render(); }
});
(async () => {
  await FILA.init();
  FILA.sub(render); setInterval(render, 500);setInterval(tickTimers, 250);
  setInterval(() => { if (authed) FILA.tick(); }, 3000);
  if (S && PIN) await login(); else loginView();
})();
</script></body></html>
