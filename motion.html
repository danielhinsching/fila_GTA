<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion · Noite de Jogos Vice City</title>
<style>@font-face{font-family:PD;src:url(assets/pricedown.otf)}@font-face{font-family:MS;src:url(assets/Montserrat.ttf);font-weight:100 900}
html,body{margin:0;height:100%;background:#12041F;overflow:hidden}
#st{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#12041F;font-family:MS,sans-serif}
#bg{position:absolute;inset:-40px;background:url(assets/bg_land.jpg) center/cover}
#sh{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(18,4,31,.25) 30%,rgba(18,4,31,.78) 100%)}
.sc{position:absolute;inset:0;opacity:0}.a{position:absolute;will-change:transform,opacity}
.ttl{position:absolute;left:0;right:0;text-align:center;font-family:PD,Impact,sans-serif;color:#ffd23f;text-shadow:7px 7px 0 #ff4fc3,0 0 40px rgba(255,79,195,.55);letter-spacing:2px;line-height:1}
.card{position:absolute;width:380px;height:230px;background:#fff;border-radius:30px;border:6px solid #ff4fc3;box-shadow:10px 10px 0 rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.card img{max-width:84%;max-height:78%;object-fit:contain}
.band{position:absolute;left:90px;right:90px;border-radius:40px;background:rgba(18,4,31,.62);border:3px solid rgba(255,79,195,.55)}
.sp{position:absolute;display:flex;align-items:center;justify-content:center}.sp img{width:100%;height:100%;object-fit:contain}
.lb{position:absolute;left:0;right:0;text-align:center;font-weight:700;letter-spacing:6px;color:#ff8fd6;font-size:30px}</style></head>
<body><div id="st"><div id="bg"></div><div id="sh"></div>
<div class="sc" id="s1">
 <img class="a" id="e" src="assets/logo.png" style="left:710px;top:40px;height:640px">
 <div id="row" style="position:absolute;left:0;right:0;top:770px;height:200px;display:flex;align-items:center;justify-content:center;gap:90px">
  <img class="r1" src="assets/liga.png" style="height:170px"><img class="r1" src="assets/liga/agora-tech-park.png" style="height:90px"><img class="r1" src="assets/superxp.png" style="height:92px"></div>
</div>
<div class="sc" id="s2"><div class="ttl a" id="t2" style="top:70px;font-size:128px">QUEM APOIA ESSE EVENTO</div><div id="g2"></div></div>
<div class="sc" id="s3"><div class="ttl a" id="t3" style="top:55px;font-size:104px">PATROCINADORES DA LIGA ÁGORA</div>
 <div class="band" style="top:215px;height:790px"></div><div id="g3"></div></div></div>
<script>
const D=8,N=3,T=D*N,E=(x)=>Math.min(1,Math.max(0,x));
const oB=x=>{x=E(x);const c=1.9,k=c+1;return 1+k*Math.pow(x-1,3)+c*Math.pow(x-1,2)};const oC=x=>1-Math.pow(1-E(x),3);
const $=s=>document.querySelector(s),st=$('#st');
// cena 2: apoiadores do evento (cartões claros para os logos escuros lerem bem)
const SUP=['arica','bsg','fox','graomestre','mega','rei','volantes','agora'];let h='';
SUP.forEach((n,i)=>{const c=i%4,r=(i/4)|0;h+=`<div class="card a c2" style="left:${140+c*420}px;top:${350+r*300}px"><img src="assets/sp/${n}.png"></div>`});$('#g2').innerHTML=h;
// cena 3: patrocinadores da Liga, tamanho por área óptica (Walbert grande, 3 médios, 5 pequenos)
const L=[['walbert',350,81,1,0],['q-assist',204,63,.5,1],['quintal-ze',107,73,.5,1],['manchester',252,46,.5,1],['amplify',142,37,.28,2],['organa',187,47,.28,2],['easy-pro',127,47,.28,2],['entrega-epi',173,41,.28,2],['futuriza',169,33,.28,2]];
const A=520*520*81/350,cy=[360,615,850],gap=[0,80,50];let rows=[[],[],[]];
L.forEach(l=>{const w=Math.sqrt(A*l[3]*l[1]/l[2]);rows[l[4]].push({n:l[0],w,h:w*l[2]/l[1]})});
h='';rows.forEach((r,ri)=>{const tot=r.reduce((s,o)=>s+o.w,0)+gap[ri]*(r.length-1);let x=(1920-tot)/2;r.forEach(o=>{h+=`<div class="sp a c3" style="left:${x}px;top:${cy[ri]-o.h/2}px;width:${o.w}px;height:${o.h}px"><img src="assets/liga/${o.n}.png"></div>`;x+=o.w+gap[ri]})});$('#g3').innerHTML=h;
function tr(el,o,y,s){el.style.opacity=o;el.style.transform=`translateY(${y}px) scale(${s})`}
window.seek=function(t){t=((t%T)+T)%T;
 $('#bg').style.transform='scale(1.04)';
 const sm=x=>{x=E(x);return x*x*(3-2*x)},show=(el,u,d,rise)=>{const q=sm(u/d);el.style.opacity=q;el.style.transform=`translateY(${(1-q)*rise}px)`};
 [0,1,2].forEach(i=>{const s=$('#s'+(i+1)),u=t-i*D;s.style.opacity=(u<0||u>D)?0:sm(u/.8)*(1-sm((u-(D-.8))/.8))});
 let u=t;
 show($('#e'),u-.2,1,20);$('#e').style.filter='drop-shadow(0 0 34px rgba(255,79,195,.6))';
 document.querySelectorAll('.r1').forEach((el,i)=>show(el,u-1-i*.3,1,16));
 u=t-D;show($('#t2'),u-.2,.9,14);document.querySelectorAll('.c2').forEach((el,i)=>show(el,u-.7-i*.12,.9,18));
 u=t-2*D;show($('#t3'),u-.2,.9,14);$('#s3 .band').style.opacity=sm((u-.4)/.8);
 document.querySelectorAll('.c3').forEach((el,i)=>show(el,u-.8-i*.14,.9,14));
};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1920*s)/2+'px';st.style.top=(innerHeight-1080*s)/2+'px'}
addEventListener('resize',fit);fit();
document.fonts.ready.then(()=>{window.READY=true;seek(0);
 if(!/render=1/.test(location.search)){const t0=performance.now();(function f(){seek((performance.now()-t0)/1000);requestAnimationFrame(f)})()}});
</script></body></html>
